model:
  _target_: src.models.bevfusion_model.BEVFusionLightningModule
  _recursive_: false
data:
  _target_: src.datamodules.detection_datamodule.DAIRV2XDataModule
  data_path_veh_cam: /mnt/d/dev/hidden/data/dairv2x/cooperative-vehicle-infrastructure/vehicle-side/
  data_path_veh_lid: /mnt/d/dev/hidden/data/dairv2x/cooperative-vehicle-infrastructure/vehicle-side/velodyne/
  path_to_data_info: /mnt/d/dev/hidden/data/dairv2x/cooperative-vehicle-infrastructure/vehicle-side/data_info.json
  path_to_gt_labels: /mnt/d/dev/hidden/data/dairv2x/cooperative-vehicle-infrastructure/vehicle-side/
  path_to_data_splits: /mnt/e/dev/hidden/projects/detection_dairv2x/src/utils/cooperative-split-data.json
  path_to_veh_calib: /mnt/d/dev/hidden/data/dairv2x/cooperative-vehicle-infrastructure/vehicle-side/calib/
  batch_size: ${batch_size},
  num_workers: 4,
  pin_memory: True,
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 500
  gpus: 1
  log_every_n_steps: 1
  gradient_clip_val: 1.0
logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: lightning_logs
  name: ${experiment_name}
  version: ${now:%Y-%m-%d_%H-%M-%S}_${experiment_name}
  default_hp_metric: false
experiment_name: try1
batch_size: 128
modelcheckpoint_monitor: null
seed: 42
